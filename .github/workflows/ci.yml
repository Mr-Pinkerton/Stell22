name: CI

# Проверяем каждый PR и пуш в main: типы, линтер, тесты, security policy,
# disposable PostgreSQL integrity suite, disposable restore drill, сборка.
# Деплоя здесь нет — production вызывает этот же workflow через workflow_call.
# Job restore-drill не получает production environment и секреты PROD_*.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git SHA or ref to check out (must match the SHA that will be deployed)
        type: string
        required: true
    outputs:
      sha:
        description: Commit SHA that CI actually checked out
        value: ${{ jobs.verify.outputs.sha }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stell22
          POSTGRES_PASSWORD: stell22
          POSTGRES_DB: stell22_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stell22 -d stell22_integrity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      sha: ${{ steps.show-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Show checked-out SHA
        id: show-sha
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "checked_out=${SHA}"
          echo "github_sha=${{ github.sha }}"
          echo "input_ref=${{ inputs.ref }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Клиент Prisma нужен для типов при typecheck, тестах и сборке.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Только pull_request. workflow_call, включая Production Deploy, и push
      # этот шаг не запускают. Флаг не попадает в npm test и не выбирает
      # базу integrity или restore-drill.
      - name: Disposable P1 PostgreSQL 17 live read
        if: github.event_name == 'pull_request'
        env:
          P1_DISPOSABLE_LIVE: "1"
        run: |
          set -euo pipefail
          docker info --format 'docker={{.ServerVersion}}'
          docker image inspect --format '{{.Id}}' postgres:17-alpine
          log="${RUNNER_TEMP}/p1-disposable-live-read.txt"
          set +e
          node scripts/vitest-run.mjs run --no-file-parallelism src/server/internal/p1-isolated-runner/live-read-probe.live.test.ts src/server/internal/p1-isolated-runner/disposable-real-migration.live.test.ts | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Disposable P1 live read failed with exit ${status}." >&2
            exit "$status"
          fi
          if grep -q 'skipped' "$log"; then
            echo "Disposable P1 live read reported a skipped test. A skip is not success." >&2
            exit 1
          fi

      - name: Server Action source policy
        run: npm run security:actions

      - name: CLI import security
        run: npm run security:cli-imports

      - name: InventoryMovement append-only policy
        run: npm run security:inventory-movement-append-only

      - name: InventoryMovement SHADOW write-gate control policy
        run: npm run security:inventory-movement-shadow-write-control

      - name: InventoryMovement INSERT confinement
        run: npm run security:inventory-movement-insert-confinement

      - name: Supply production preflight workflow safety
        run: npm run security:supply-preflight-workflow

      - name: SHADOW activation control policy
        run: npm run security:shadow-activation-control

      - name: SHADOW soak evidence policy
        run: npm run security:shadow-soak-evidence

      - name: PostgreSQL-backed integrity suite
        env:
          INTEGRITY_TEST_DATABASE_URL: postgresql://stell22:stell22@127.0.0.1:5432/stell22_integrity?schema=public
          DATABASE_URL: postgresql://stell22:stell22@127.0.0.1:5432/stell22_integrity?schema=public
        run: npm run test:integrity:ci

      # Сборка без подключения к БД (как в Dockerfile) — ловим ошибки
      # типов и битые страницы до ручного деплоя на прод.
      - name: Build
        run: npm run build

      - name: Server Action manifest policy
        run: npm run security:manifest

  restore-drill:
    name: Disposable restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stell22
          POSTGRES_PASSWORD: stell22
          POSTGRES_DB: stell22_restore_drill_admin
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U stell22 -d stell22_restore_drill_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --label stell22.restore-drill-run=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Genuine disposable restore drill
        env:
          STELL22_RESTORE_DRILL_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/restore-drill-ci.mjs
