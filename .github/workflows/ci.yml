name: CI

# Проверяем каждый PR и пуш в main: типы, линтер, тесты, сборка.
# Деплоя здесь нет — production выкатывается отдельным workflow_dispatch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Клиент Prisma нужен для типов при typecheck, тестах и сборке.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Сборка без подключения к БД (как в Dockerfile) — ловим ошибки
      # типов и битые страницы до ручного деплоя на прод.
      - name: Build
        run: npm run build
