name: SHADOW soak evidence

# Manual read-only diagnostic for SHADOW soak evidence.
# It does not activate, deactivate, reset, deploy, or declare soak complete.
on:
  workflow_dispatch:
    inputs:
      expected_application_sha:
        description: Deployed production application SHA. Not GitHub main.
        required: true
        type: string
      shift_start_utc:
        description: Inclusive UTC shift start YYYYMMDDTHHMMSSZ. Empty skips shift coverage.
        required: false
        default: ""
        type: string
      shift_end_utc:
        description: Inclusive UTC shift end YYYYMMDDTHHMMSSZ. Empty skips shift coverage.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: inventory-movement-shadow-soak-evidence
  cancel-in-progress: false

jobs:
  contract:
    name: Pin production application SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      expected_sha: ${{ steps.pin.outputs.expected_sha }}
    steps:
      - name: Refuse unless workflow_dispatch ref is canonical main
        run: |
          set -euo pipefail
          echo "GITHUB_REF=${GITHUB_REF}"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "REFUSE code=DISPATCH_REF_NOT_MAIN" >&2
            exit 1
          fi

      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prove checkout equals origin/main
        run: bash scripts/shadow-activation-assert-canonical-main.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse unless the supplied SHA is the pinned production application
        id: pin
        env:
          EXPECTED_APPLICATION_SHA: ${{ inputs.expected_application_sha }}
          PINNED_PRODUCTION_APPLICATION_SHA: 678cbc1d308ddfe568b901ebf53f7e05f9a8c014
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_APPLICATION_SHA" != "$PINNED_PRODUCTION_APPLICATION_SHA" ]]; then
            echo "REFUSE code=SHA_NOT_PINNED" >&2
            exit 1
          fi
          npx tsx scripts/shadow-soak-evidence-policy.ts assert-pin
          echo "WORKFLOW_CHECKOUT_SHA=$(git rev-parse HEAD)"
          echo "PINNED_PRODUCTION_APPLICATION_SHA=${PINNED_PRODUCTION_APPLICATION_SHA}"
          echo "WORKFLOW_CHECKOUT_IS_NOT_THE_PRODUCTION_APPLICATION_PIN=YES"

  evidence:
    name: Read-only SHADOW soak evidence
    needs: contract
    if: github.ref == 'refs/heads/main' && needs.contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PINNED_PRODUCTION_APPLICATION_SHA: 678cbc1d308ddfe568b901ebf53f7e05f9a8c014
      EXPECTED_APPLICATION_SHA: ${{ needs.contract.outputs.expected_sha }}
      SHIFT_START: ${{ inputs.shift_start_utc }}
      SHIFT_END: ${{ inputs.shift_end_utc }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prove checkout equals origin/main before production access
        run: bash scripts/shadow-activation-assert-canonical-main.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-check application pin before production access
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_APPLICATION_SHA" != "$PINNED_PRODUCTION_APPLICATION_SHA" ]]; then
            echo "REFUSE code=SHA_NOT_PINNED" >&2
            exit 1
          fi
          npx tsx scripts/shadow-soak-evidence-policy.ts assert-pin

      - name: Refuse an incomplete shift interval
        run: |
          set -euo pipefail
          if [[ -z "$SHIFT_START" && -z "$SHIFT_END" ]]; then
            exit 0
          fi
          if [[ -z "$SHIFT_START" || -z "$SHIFT_END" ]]; then
            echo "REFUSE code=SHIFT_INTERVAL_INVALID" >&2
            exit 1
          fi
          if [[ ! "$SHIFT_START" =~ ^[0-9]{8}T[0-9]{6}Z$ || ! "$SHIFT_END" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "REFUSE code=SHIFT_INTERVAL_INVALID" >&2
            exit 1
          fi
          if [[ "$SHIFT_START" > "$SHIFT_END" ]]; then
            echo "REFUSE code=SHIFT_INTERVAL_INVALID" >&2
            exit 1
          fi

      - name: Check required secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
        run: |
          missing=0
          for name in PROD_HOST PROD_USER PROD_SSH_KEY PROD_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets on the GitHub Environment \"production\"." >&2
            exit 1
          fi

      - name: Read-only soak evidence snapshot
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          EXPECTED_SHA: ${{ needs.contract.outputs.expected_sha }}
        run: |
          set -euo pipefail
          bash scripts/shadow-soak-evidence-ssh.sh snapshot > snapshot.txt
          npx tsx scripts/shadow-soak-evidence-policy.ts assert-snapshot --snapshot=snapshot.txt
          npx tsx scripts/shadow-soak-evidence-policy.ts evaluate --snapshot=snapshot.txt
