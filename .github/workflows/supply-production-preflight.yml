name: Supply Production Preflight

# Manual read-only Supply counts only. This workflow never deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only Supply production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check required secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}
        run: |
          missing=0
          for name in PROD_HOST PROD_USER PROD_SSH_KEY PROD_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets on the GitHub Environment \"production\"." >&2
            exit 1
          fi

      - name: Read-only Supply counts
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_DIR: ${{ secrets.PROD_APP_DIR }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          command_timeout: 5m
          envs: APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            if [[ ! -f docker-compose.prod.yml ]]; then
              echo "ERROR: docker-compose.prod.yml not found in $APP_DIR" >&2
              exit 1
            fi
            sql='BEGIN TRANSACTION READ ONLY;
            SELECT
              COUNT(*)::text,
              COUNT(*) FILTER (WHERE "deductedQty" > 0)::text,
              COUNT(*) FILTER (WHERE "deductedQty" = 0 AND "shortfallQty" > 0)::text,
              COUNT(*) FILTER (WHERE "stockAccountingOpen" = true AND "deductedQty" > 0)::text
            FROM "Supply"
            WHERE "productId" IS NULL
              AND ("deductedQty" > 0 OR "shortfallQty" > 0);
            COMMIT;'
            row="$(printf '%s\n' "$sql" | docker compose -f docker-compose.prod.yml exec -T db \
              psql -U stell22 -d stell22 -v ON_ERROR_STOP=1 -At -F $'\t')"
            row="$(printf '%s\n' "$row" | awk 'NF { print; exit }')"
            IFS=$'\t' read -r total deducted_positive shortfall_only open_deducted_positive <<<"$row"
            for value in total deducted_positive shortfall_only open_deducted_positive; do
              if ! [[ "${!value}" =~ ^[0-9]+$ ]]; then
                echo "ERROR: could not parse ${value} from read-only query" >&2
                exit 1
              fi
            done
            blocker=NO
            if [[ "$open_deducted_positive" -gt 0 ]]; then
              blocker=YES
            fi
            echo "SUPPLY_PREFLIGHT_TOTAL=${total}"
            echo "SUPPLY_PREFLIGHT_DEDUCTED_POSITIVE=${deducted_positive}"
            echo "SUPPLY_PREFLIGHT_SHORTFALL_ONLY=${shortfall_only}"
            echo "SUPPLY_PREFLIGHT_OPEN_DEDUCTED_POSITIVE=${open_deducted_positive}"
            echo "SUPPLY_DATA_BLOCKER=${blocker}"
